<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#06090f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Winess Hub</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/winess-icon.svg">
    <link rel="stylesheet" href="styles.css?v=305">
    <script type="module" src="app.js?v=305"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#accueil"><span class="brand-mark">W</span><strong>Winess Hub</strong></a>
        <span class="sync-state" id="syncState">Connexion...</span>
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Ouvrir ou fermer le menu"><span></span></button>
        <nav class="nav-list" aria-label="Navigation">
          <button class="nav-item is-active" data-view="accueil" type="button">Accueil</button>
          <button class="nav-item" data-view="mes-taches" type="button">Mes tâches <span class="nav-badge" id="myTasksBadge">0</span></button>
          <button class="nav-item" data-view="rubrique-preparation" data-rubric="preparation" data-icon="📦" type="button">Préparation commande</button>
          <button class="nav-item" data-view="rubrique-blocage" data-rubric="blocage" data-icon="📌" type="button">Blocage produit</button>
          <button class="nav-item" data-view="rubrique-livraison" data-rubric="livraison" data-icon="🚚" type="button">Livraison</button>
          <button class="nav-item" data-view="rubrique-inventaire" data-rubric="inventaire" data-icon="📊" type="button">Inventaire</button>
          <button class="nav-item" data-view="rubrique-rappel" data-rubric="rappel" data-icon="📞" type="button">Rappel client</button>
          <button class="nav-item" data-view="rubrique-litige" data-rubric="litige" data-icon="⚠️" type="button">Litige</button>
          <button class="nav-item" data-view="rubrique-fournisseur" data-rubric="fournisseur" data-icon="🛒" type="button">Commande fournisseur</button>
          <button class="nav-item" data-view="rubrique-devis" data-rubric="devis" data-icon="🧾" type="button">Devis non facturés</button>
          <button class="nav-item" data-view="rubrique-instagram" data-rubric="instagram" data-icon="📱" type="button">Relance Instagram</button>
          <button class="nav-item" data-view="rubrique-autre" data-rubric="autre" data-icon="📋" type="button">Autre</button>
          <button class="nav-item" data-view="activite" type="button">Activité</button>
          <button class="nav-item" data-view="archives" type="button">Archives</button>
        </nav>
        <div class="active-profile-card">
          <span class="active-profile-avatar" id="activeProfileAvatar">?</span>
          <span><strong id="activeProfileName">Profil requis</strong><small id="activeProfileRole">Cet appareil</small></span>
          <button id="changeProfileButton" type="button">Changer</button>
        </div>
      </aside>

      <main class="workspace">
        <section class="iphone-help" id="iphoneHelp" aria-live="polite"></section>
        <section class="global-search" role="search">
          <input id="globalSearch" type="search" placeholder="🔍 Rechercher une tâche, un client, un collaborateur, une commande..." autocomplete="off" aria-label="Recherche globale">
          <div class="search-filters" id="searchFilters" aria-label="Filtres recherche">
            <button class="is-active" data-search-filter="all" type="button">Tout</button>
            <button data-search-filter="active" type="button">En cours</button>
            <button data-search-filter="done" type="button">Terminées</button>
            <button data-search-filter="archived" type="button">Archivées</button>
            <button data-search-filter="urgent" type="button">Urgentes</button>
            <button data-search-filter="livraison" type="button">Livraisons</button>
            <button data-search-filter="commandes" type="button">Commandes</button>
            <button data-search-filter="inventaire" type="button">Inventaire</button>
            <button data-search-filter="litige" type="button">Litiges</button>
          </div>
          <div class="search-results" id="searchResults" hidden></div>
        </section>

        <section class="view is-active team-dashboard" data-panel="accueil">
          <section class="daily-urgencies">
            <h2>🔥 Urgences du jour</h2>
            <div class="urgency-list" id="urgentList"></div>
          </section>
          <div class="employee-grid" id="directionGrid"></div>
          <div class="employee-grid staff-grid" id="staffGrid"></div>
        </section>

        <section class="view tool-view" data-panel="mes-taches">
          <p class="eyebrow">Mes tâches</p><h2>Tâches assignées</h2>
          <section class="push-panel">
            <div class="push-profile"><span>Profil actif</span><strong id="pushProfileName">Non identifié</strong></div>
            <button class="push-button" id="enablePushButton" type="button">Activer les notifications iPhone</button>
            <span class="push-state" id="pushState">Notifications non activées</span>
          </section>
          <div class="tool-list" id="myTasksList"></div>
        </section>

        <section class="view tool-view" data-panel="rubrique"><p class="eyebrow">Rubrique</p><h2 id="rubricTitle"></h2><div class="rubric-summary" id="rubricSummary"></div><div class="tool-list" id="rubricList"></div></section>
        <section class="view tool-view" data-panel="activite"><p class="eyebrow">Activité</p><h2>Journal de bord</h2><div class="activity-feed" id="activityList"></div></section>
        <section class="view tool-view" data-panel="archives"><p class="eyebrow">Archives</p><h2>Tâches terminées</h2><div class="tool-list" id="archivesList"></div></section>
      </main>
    </div>

    <input class="avatar-upload" id="avatarUpload" type="file" accept="image/*">
    <div class="app-toast" id="appToast" role="status" aria-live="polite"></div>

    <dialog class="member-dialog" id="memberDialog">
      <article class="member-sheet"><button class="icon-close" data-close="memberDialog" type="button">×</button><div id="memberDetails"></div></article>
    </dialog>

    <dialog class="member-dialog" id="taskDialog">
      <article class="member-sheet"><button class="icon-close" data-close="taskDialog" type="button">×</button><div id="taskDetails"></div></article>
    </dialog>

    <dialog class="profile-gate" id="profileGate">
      <article class="profile-gate-sheet">
        <span class="profile-gate-mark">W</span>
        <div id="profileGateContent"></div>
      </article>
    </dialog>
  </body>
</html>
