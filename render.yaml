services:
  - type: web
    runtime: node
    name: winess-hub-push
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contact@winess.fr
      - key: CORS_ORIGIN
        value: https://steven77726.github.io,http://127.0.0.1:4177,http://localhost:4177
